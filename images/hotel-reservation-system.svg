  <text x="86" y="311" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1a1033">STANDARD ROOM</text><text x="86" y="355" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1a1033">$89 / night</text><text x="86" y="397" font-family="Arial,sans-serif" font-size="16" fill="#1a1033">✓ Available</text>
